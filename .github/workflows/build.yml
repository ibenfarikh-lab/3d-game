name: Build PS2 Homebrew 3D

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # Diubah ke v4

    - name: Compile dengan Makefile
      run: make clean all

    - name: Upload file ELF
      uses: actions/upload-artifact@v4 # Diubah ke v4
      with:
        name: ular-tangga-3d-elf
        path: ular-tangga-3d.elf
