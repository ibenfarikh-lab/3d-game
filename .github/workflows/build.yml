name: Build PS2 Homebrew 3D

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    # Baris 'container:' dihapus karena kita pakai Setup Action di bawah
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Toolchain PS2Dev
      uses: ps2dev/setup-ps2dev@v1 # Action resmi untuk menginstal PS2SDK
      with:
        default: true

    - name: Compile dengan Makefile
      run: make clean all

    - name: Upload file ELF
      uses: actions/upload-artifact@v4
      with:
        name: ular-tangga-3d-elf
        path: ular-tangga-3d.elf
