name: Build PS2 Homebrew 3D

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Compile dengan Docker PS2Dev
      # Menggunakan docker run agar path PS2SDK dan make terbaca sempurna
      run: docker run --rm -v ${{ github.workspace }}:/src -w /src ps2dev/ps2dev:latest make clean all

    - name: Upload file ELF
      uses: actions/upload-artifact@v4
      with:
        name: ular-tangga-3d-elf
        path: ular-tangga-3d.elf
